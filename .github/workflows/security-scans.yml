name: Security Scans (Bandit & pip-audit)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: Bandit (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: pip install --upgrade pip 'bandit[sarif]==1.8.6'

      - name: Run Bandit baseline (SARIF)
        shell: bash
        run: |
          set -uo pipefail

          set +e
          bandit -r \
            backend/helpchain_backend/src \
            backend/admin \
            backend/core \
            backend/routes \
            backend/scripts/ensure_render_admin.py \
            backend/scripts/run_notification_job_processor.py \
            backend/*.py \
            appy.py \
            run.py \
            wsgi.py \
            --exclude tests,migrations,vendor,_vendor,_archive,.venv,venv,env,build,dist,__pycache__,.pytest_cache,.ruff_cache,.mypy_cache,backend/backups,backend/tests,backend/migrations,backend/vendor,backend/helpchain_backend/vendor,backend/helpchain_backend/src/test_asgi.py,backend/appy_with_analytics.py,backend/notification_dashboard.py,backend/app.legacy.py,backend/security_logging.py,backend/helpchain_backend/src/security_logging.py \
            --severity-level medium \
            --confidence-level medium \
            --format sarif \
            --output bandit.sarif
          status=$?
          set -e

          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            echo "Bandit failed to execute (exit code $status)."
            exit "$status"
          fi

          python -c "import json; data=json.load(open('bandit.sarif', encoding='utf-8')); assert data.get('version') == '2.1.0' and isinstance(data.get('runs'), list)"

          if [[ "$status" -eq 1 ]]; then
            echo "Bandit found baseline findings; report uploaded for review (temporarily non-blocking)."
          else
            echo "Bandit completed with no findings at the configured threshold."
          fi

      - name: Upload SARIF (Bandit)
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@be1102e4461872bb6506cd26561a31b56671ace0 # v3
        with:
          sarif_file: bandit.sarif

  pip-audit:
    name: pip-audit (Dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pip-audit
        run: pip install --upgrade pip pip-audit==2.10.1

      - name: Audit canonical runtime requirements (JSON baseline)
        shell: bash
        run: |
          set -uo pipefail

          if [[ ! -f requirements.txt ]]; then
            echo "Canonical runtime manifest requirements.txt is missing."
            exit 2
          fi

          set +e
          pip-audit \
            --requirement requirements.txt \
            --format json \
            --output pip-audit.requirements.json \
            --strict \
            --progress-spinner off
          status=$?
          set -e

          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            echo "pip-audit failed to execute (exit code $status)."
            exit "$status"
          fi

          python -c "import json; data=json.load(open('pip-audit.requirements.json', encoding='utf-8')); assert isinstance(data.get('dependencies'), list)"

          if [[ "$status" -eq 1 ]]; then
            echo "pip-audit found baseline vulnerabilities; report uploaded for review (temporarily non-blocking)."
          else
            echo "pip-audit completed with no known vulnerabilities."
          fi

      - name: Upload pip-audit baseline report
        if: always() && hashFiles('pip-audit.requirements.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pip-audit-runtime-baseline
          path: pip-audit.requirements.json

