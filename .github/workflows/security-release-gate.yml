name: Security Release Gate (reporting)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: "PR head commit SHA to inspect"
        required: true
        type: string
      base_sha:
        description: "Trusted base commit SHA containing the baseline"
        required: true
        type: string

permissions:
  contents: read
  security-events: read
  pull-requests: read
  actions: read

concurrency:
  group: security-release-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Security release gate diagnostics (non-authoritative)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5
        with:
          python-version: "3.11"

      - name: Audit API dependency manifest
        shell: bash
        run: |
          set +e
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          install_status=$?
          if [[ "$install_status" -eq 0 ]]; then
            pip-audit --requirement api/requirements.txt --format json --output api-pip-audit.json --strict --progress-spinner off
            audit_status=$?
          else
            audit_status=$install_status
          fi
          set -e
          python scripts/security_release_gate_collect.py pip-audit \
            --pages api-pip-audit.json \
            --output .api-dependency-status.json \
            --findings-output .api-dependency-findings.json \
            --status-code "$audit_status"

      - name: Archive API pip-audit report
        if: always() && hashFiles('api-pip-audit.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pip-audit-api-json
          path: api-pip-audit.json
          retention-days: 7

      - name: Resolve trusted PR SHAs and baseline
        id: refs
        env:
          EVENT_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.sha || inputs.head_sha }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          for value in "$EVENT_HEAD_SHA" "$EVENT_BASE_SHA"; do
            if ! [[ "$value" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid scanned or event base SHA"
              exit 1
            fi
          done
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if ! [[ "$EVENT_PR_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::Invalid PR head SHA"
              exit 1
            fi
            [[ "$(git rev-parse HEAD)" == "$EVENT_HEAD_SHA" ]]
            read -r scanned scan_base scan_head extra <<< "$(git rev-list --parents -n 1 "$EVENT_HEAD_SHA")"
            if [[ "$scanned" != "$EVENT_HEAD_SHA" || -n "${extra:-}" || "$scan_head" != "$EVENT_PR_HEAD_SHA" || ! "$scan_base" =~ ^[0-9a-fA-F]{40}$ || "$scan_base" == "$scan_head" ]]; then
              echo "::error::Scanned merge has invalid ordered base/head parents"
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > reporting-pr.json
            python - <<'PYTHON'
          import json
          import os
          pr = json.load(open("reporting-pr.json", encoding="utf-8"))
          assert pr.get("number") == int(os.environ["PR_NUMBER"]), "PR number mismatch"
          assert pr.get("state") == "open", "PR is no longer open"
          assert pr.get("head", {}).get("sha") == os.environ["EVENT_PR_HEAD_SHA"], "PR head changed"
          assert pr.get("merge_commit_sha") == os.environ["EVENT_HEAD_SHA"], "PR merge commit changed"
          assert pr.get("base", {}).get("ref") == os.environ["DEFAULT_BRANCH"], "PR targets a different branch"
          assert pr.get("base", {}).get("repo", {}).get("full_name") == os.environ["GITHUB_REPOSITORY"], "PR base repository mismatch"
          PYTHON
            current_base="$(python -c "import json; print(json.load(open('reporting-pr.json'))['base']['sha'])")"
            [[ "$current_base" =~ ^[0-9a-fA-F]{40}$ ]]
            git fetch --no-tags origin "refs/heads/${DEFAULT_BRANCH}"
            trusted_base="$(git rev-parse FETCH_HEAD)"
            if ! git merge-base --is-ancestor "$scan_base" "$trusted_base" || ! git merge-base --is-ancestor "$EVENT_BASE_SHA" "$trusted_base"; then
              echo "::error::Merge parent or event base is outside trusted default branch ancestry"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$EVENT_BASE_SHA" "$scan_base" && ! git merge-base --is-ancestor "$scan_base" "$EVENT_BASE_SHA"; then
              echo "::error::Event base and scanned base have unrelated ancestry"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current_base" "$trusted_base"; then
              echo "::error::Current PR base is outside trusted default branch ancestry"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$current_base" "$scan_base" && ! git merge-base --is-ancestor "$scan_base" "$current_base"; then
              echo "::error::Current PR base and scanned base have unrelated ancestry"
              exit 1
            fi
            EVENT_BASE_SHA="$scan_base"
          fi
          if git show "$EVENT_BASE_SHA:docs/security/security-release-gate-baseline.json" > trusted-baseline.json; then
            echo "baseline_source=trusted-base-commit" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Trusted baseline is unavailable at verified base commit"
            exit 1
          fi
          echo "head_sha=$EVENT_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_head_sha=$EVENT_PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "base_sha=$EVENT_BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Collect current Code Scanning alerts
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        shell: bash
        run: |
          set -uo pipefail
          set +e
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${HEAD_SHA}&per_page=100" \
            > .security-alert-pages.json
          api_status=$?
          set -e
          if [[ "$api_status" -eq 0 ]] && python scripts/security_release_gate_collect.py alerts --pages .security-alert-pages.json --output .security-alerts.json; then
            export API_OK=true
            echo "api_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo '[]' > .security-alerts.json
            export API_OK=false
            echo "api_ok=false" >> "$GITHUB_OUTPUT"
          fi
          python -c "import json, os; ok=os.environ.get('API_OK') == 'true'; json.dump([{'name':'github-code-scanning-api','evidence_class':'code_scanning_api','status':'success' if ok else 'missing','report_present':ok,'report_valid':ok,'run_id':'code-scanning-api:'+os.environ.get('HEAD_SHA',''),'head_sha':os.environ.get('HEAD_SHA'),'event':'pull_request'}], open('.security-scan-status.json','w',encoding='utf-8'))"

      - name: Collect scanner artifacts and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          PR_HEAD_SHA: ${{ steps.refs.outputs.pr_head_sha }}
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        shell: bash
        run: |
          set -uo pipefail
          evidence_status=1
          for attempt in {1..20}; do
            set +e
            pr_head_args=()
            if [[ -n "$PR_HEAD_SHA" ]]; then pr_head_args=(--pr-head-sha "$PR_HEAD_SHA"); fi
            python scripts/security_release_gate_collect.py collect-evidence \
              --token "$GH_TOKEN" --repository "$GITHUB_REPOSITORY" \
              --head-sha "$HEAD_SHA" "${pr_head_args[@]}" --base-sha "$BASE_SHA" \
              --temp-root "$RUNNER_TEMP/security-release-gate-evidence" \
              --output .required-scanner-status.json \
              --findings-output .scanner-findings.json
            evidence_status=$?
            if [[ "$evidence_status" -eq 0 ]] && ! python -c "import json; s=json.load(open('.required-scanner-status.json',encoding='utf-8')); raise SystemExit(0 if any(x.get('status') in {'missing','incomplete'} for x in s) else 1)"; then
              break
            fi
            set -e
            if [[ "$attempt" -lt 20 ]]; then
              sleep 30
            fi
          done
          if [[ ! -s .required-scanner-status.json ]]; then
            python -c "import json; json.dump([{'name':'scanner-evidence-collection','status':'missing','report_present':False,'report_valid':False,'run_id':None,'head_sha':None,'event':None,'reason':'collector failed'}], open('.required-scanner-status.json','w',encoding='utf-8'))"
          fi
          if [[ ! -s .scanner-findings.json ]]; then echo '[]' > .scanner-findings.json; fi
          if [[ -s .api-dependency-findings.json ]]; then
            python -c "import json; p='.scanner-findings.json'; a=json.load(open(p,encoding='utf-8')); b=json.load(open('.api-dependency-findings.json',encoding='utf-8')); json.dump(a+b, open(p,'w',encoding='utf-8'))"
          fi
          python scripts/security_release_gate_collect.py merge --api-status .security-scan-status.json --scanner-status .required-scanner-status.json --output .security-scan-status.json
          python scripts/security_release_gate_collect.py merge --api-status .security-scan-status.json --scanner-status .api-dependency-status.json --output .security-scan-status.json

      - name: Evaluate baseline
        id: gate
        env:
          API_OK: ${{ steps.alerts.outputs.api_ok }}
        shell: bash
        run: |
          args=(
            --baseline trusted-baseline.json
            --alerts .security-alerts.json
            --scan-status .security-scan-status.json
            --scanner-findings .scanner-findings.json
            --output security-release-gate-report.json
            --repository "$GITHUB_REPOSITORY"
            --head-sha "${{ steps.refs.outputs.head_sha }}"
            --base-sha "${{ steps.refs.outputs.base_sha }}"
          )
          if [[ "$API_OK" == "true" ]]; then
            args+=(--api-ok)
          fi
          set +e
          python scripts/security_release_gate.py "${args[@]}" | tee security-release-gate-summary.txt
          verdict_status=${PIPESTATUS[0]}
          echo "technical_exit_code=$verdict_status" >> security-release-gate-summary.txt
          exit "$verdict_status"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Security Release Gate'
            echo
            echo 'Diagnostic mode: this job is non-authoritative and does not issue the security verdict.'
            echo 'Authoritative verdict source: Security Release Gate (trusted evaluator).'
            echo
            cat security-release-gate-summary.txt 2>/dev/null || echo 'INCOMPLETE: no report was produced.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-release-gate-diagnostics
          retention-days: 7
          path: |
            security-release-gate-report.json
            .security-alerts.json
            api-pip-audit.json
