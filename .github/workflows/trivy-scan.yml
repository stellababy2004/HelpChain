name: Trivy Security Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * *" # Всеки ден 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# SHA-256 verified against the official release checksum and downloaded archive.
env:
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

jobs:
  trivy-iac:
    name: Trivy IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Linux" && "$(uname -m)" == "x86_64" ]]
          install_dir="$(mktemp -d "${RUNNER_TEMP}/trivy.XXXXXX")"
          archive="${install_dir}/trivy.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" trivy
          "${install_dir}/trivy" --version | grep -Fx "Version: ${TRIVY_VERSION}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          version: "v0.76.2"
          skip-setup-trivy: true
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-iac-results.sarif"

      - name: Archive Trivy IaC SARIF for trusted gate
        if: always() && hashFiles('trivy-iac-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-iac-sarif
          path: trivy-iac-results.sarif
          retention-days: 7

      - name: Upload Trivy IaC SARIF
        uses: github/codeql-action/upload-sarif@be1102e4461872bb6506cd26561a31b56671ace0
        if: always()
        with:
          sarif_file: "trivy-iac-results.sarif"

  trivy-repo:
    name: Trivy Repository Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install verified Trivy binary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Linux" && "$(uname -m)" == "x86_64" ]]
          install_dir="$(mktemp -d "${RUNNER_TEMP}/trivy.XXXXXX")"
          archive="${install_dir}/trivy.tar.gz"
          curl --fail --silent --show-error --location \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" trivy
          "${install_dir}/trivy" --version | grep -Fx "Version: ${TRIVY_VERSION}"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run Trivy Repository Scanner
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8
        with:
          version: "v0.76.2"
          skip-setup-trivy: true
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-repo-results.sarif"
          skip-dirs: "node_modules,.git,.venv,venv,__pycache__,.pytest_cache"

      - name: Archive Trivy Repository SARIF for trusted gate
        if: always() && hashFiles('trivy-repo-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-repo-sarif
          path: trivy-repo-results.sarif
          retention-days: 7

      - name: Upload Trivy Repo SARIF
        uses: github/codeql-action/upload-sarif@be1102e4461872bb6506cd26561a31b56671ace0
        if: always()
        with:
          sarif_file: "trivy-repo-results.sarif"
