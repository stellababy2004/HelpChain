
name: HelpChain Notion CI Sync

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  notion-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check configuration
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
        run: |
          if [ -z "$NOTION_API_TOKEN" ]; then
            echo "::error::NOTION_API_TOKEN is missing"
            exit 1
          fi

          echo "Notion token is configured."
          echo "No data has been sent to Notion."
