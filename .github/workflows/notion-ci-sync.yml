name: HelpChain Notion CI Sync

on:
  workflow_run:
    workflows:
      - CI
      - HelpChain Quality Gate Full
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Existing GitHub Actions run ID to sync"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: notion-ci-sync-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  notion-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
      NOTION_DATA_SOURCE_ID: 5fd74404-5bd0-49dc-b9eb-22885b559612
      GH_API: https://api.github.com
      NOTION_API: https://api.notion.com/v1
      NOTION_VERSION: 2025-09-03

    steps:
      - name: Sync completed run to Notion
        shell: bash
        env:
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${NOTION_API_TOKEN:-}" ]]; then
            echo "::error::NOTION_API_TOKEN is missing"
            exit 1
          fi

          run_id="${EVENT_RUN_ID:-}"
          if [[ -z "$run_id" ]]; then
            run_id="${INPUT_RUN_ID:-}"
          fi
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::A numeric run_id is required"
            exit 1
          fi

          notion_request() {
            local method="$1"
            local url="$2"
            local body="${3:-}"
            local attempt=1
            local max_attempts=4
            local status
            local response_file

            response_file="$(mktemp)"
            while (( attempt <= max_attempts )); do
              if [[ -n "$body" ]]; then
                status="$(curl -sS --fail-with-body -o "$response_file" -w '%{http_code}' \
                  -X "$method" "$url" \
                  -H "Authorization: Bearer ${NOTION_API_TOKEN}" \
                  -H "Notion-Version: ${NOTION_VERSION}" \
                  -H 'Content-Type: application/json' \
                  --data "$body" || true)"
              else
                status="$(curl -sS --fail-with-body -o "$response_file" -w '%{http_code}' \
                  -X "$method" "$url" \
                  -H "Authorization: Bearer ${NOTION_API_TOKEN}" \
                  -H "Notion-Version: ${NOTION_VERSION}" \
                  -H 'Content-Type: application/json' || true)"
              fi

              if [[ "$status" =~ ^2[0-9][0-9]$ ]]; then
                cat "$response_file"
                rm -f "$response_file"
                return 0
              fi

              if [[ "$status" == "429" || "$status" =~ ^5[0-9][0-9]$ || "$status" == "000" ]]; then
                sleep_seconds=$((2 ** (attempt - 1)))
                sleep "$sleep_seconds"
                attempt=$((attempt + 1))
                continue
              fi

              echo "::error::Notion API request failed with HTTP ${status}"
              rm -f "$response_file"
              return 1
            done

            echo "::error::Notion API request failed after ${max_attempts} attempts"
            rm -f "$response_file"
            return 1
          }

          run_json="$(mktemp)"
          trap 'rm -f "$run_json" "$query_json" "$page_json"' EXIT
          curl -sS --fail --retry 2 -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o "$run_json" \
            "${GH_API}/repos/${REPOSITORY}/actions/runs/${run_id}"

          workflow="$(jq -r '.name // empty' "$run_json")"
          sha="$(jq -r '.head_sha // empty' "$run_json")"
          run_date="$(jq -r '.created_at // empty' "$run_json")"
          conclusion="$(jq -r '.conclusion // empty' "$run_json")"
          html_url="$(jq -r '.html_url // empty' "$run_json")"

          if [[ -z "$workflow" || -z "$sha" || -z "$run_date" || -z "$html_url" ]]; then
            echo "::error::GitHub run metadata is incomplete"
            exit 1
          fi

          case "$conclusion" in
            success) status="PASS"; next_action="No action required" ;;
            failure) status="FAIL"; next_action="Review failed jobs and rerun after fixing the cause" ;;
            cancelled) status="CANCELLED"; next_action="Determine why the run was cancelled before rerunning" ;;
            *) status="OTHER"; next_action="Review the run conclusion and decide whether a rerun is needed" ;;
          esac

          query_json="$(mktemp)"
          jq -n --arg run_id "$run_id" '{filter:{property:"Run ID",number:{equals:($run_id|tonumber)}},page_size:10}' > "$query_json"
          existing_json="$(notion_request POST "${NOTION_API}/data_sources/${NOTION_DATA_SOURCE_ID}/query" "$(<"$query_json")")"
          page_id="$(jq -r '.results[0].id // empty' <<<"$existing_json")"

          page_json="$(mktemp)"
          jq -n \
            --arg workflow "$workflow" \
            --arg run_id "$run_id" \
            --arg sha "$sha" \
            --arg run_date "$run_date" \
            --arg status "$status" \
            --arg html_url "$html_url" \
            --arg next_action "$next_action" \
            '{properties:{
              Workflow:{title:[{text:{content:$workflow}}]},
              "Run ID":{number:($run_id|tonumber)},
              "Commit SHA":{rich_text:[{text:{content:$sha}}]},
              Date:{date:{start:$run_date}},
              Status:{select:{name:$status}},
              "GitHub URL":{url:$html_url},
              "Next Action":{rich_text:[{text:{content:$next_action}}]}
            }}' > "$page_json"

          if [[ -n "$page_id" ]]; then
            notion_request PATCH "${NOTION_API}/pages/${page_id}" "$(<"$page_json")" >/dev/null
            echo "Updated Notion record for run ${run_id}"
            exit 0
          fi

          # Re-query immediately before create to close the check-then-create race
          # if a duplicate event was accepted while the first query was running.
          existing_json="$(notion_request POST "${NOTION_API}/data_sources/${NOTION_DATA_SOURCE_ID}/query" "$(<"$query_json")")"
          page_id="$(jq -r '.results[0].id // empty' <<<"$existing_json")"
          if [[ -n "$page_id" ]]; then
            notion_request PATCH "${NOTION_API}/pages/${page_id}" "$(<"$page_json")" >/dev/null
            echo "Updated Notion record for run ${run_id}"
          else
            notion_request POST "${NOTION_API}/pages" "$(jq --arg ds "$NOTION_DATA_SOURCE_ID" '.parent={data_source_id:$ds}' "$page_json")" >/dev/null
            echo "Created Notion record for run ${run_id}"
          fi
