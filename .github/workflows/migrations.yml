name: Migration Safety

on:
  push:
    paths:
      - "migrations/**"
      - "scripts/migration_guard.py"
      - "tests/test_migration_guard.py"
      - ".github/workflows/migrations.yml"
  pull_request:
    paths:
      - "migrations/**"
      - "scripts/migration_guard.py"
      - "tests/test_migration_guard.py"
      - ".github/workflows/migrations.yml"

jobs:
  migrations:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Find changed migrations
        id: changed-migrations
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          git diff --name-only --diff-filter=AM "$BASE" "${{ github.sha }}" -- "migrations/versions/*.py" > changed_migrations.txt

          echo "Changed migrations:"
          cat changed_migrations.txt

      - name: Migration safety guard
        shell: bash
        run: |
          mapfile -t migrations < changed_migrations.txt
          python scripts/migration_guard.py "${migrations[@]}"
