name: Backup Postgres to S3

on:
  # Temporarily disabled during Neon quota recovery; manual runs remain available.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc > /dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Check PostgreSQL client version
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Check AWS CLI
        run: |
          aws --version

      - name: Debug AWS identity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws sts get-caller-identity

      - name: Dump PostgreSQL
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
          FILE="backup_${TIMESTAMP}_${GITHUB_SHA}.sql"
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" > "$FILE"
          gzip "$FILE"
          BACKUP_FILE="$FILE.gz"
          sha256sum "$BACKUP_FILE" > "$BACKUP_FILE.sha256"
          export BACKUP_FILE
          python - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          backup = Path(os.environ["BACKUP_FILE"])
          sha256 = hashlib.sha256(backup.read_bytes()).hexdigest()
          manifest = {
              "backup_file": backup.name,
              "sha256": sha256,
              "size_bytes": backup.stat().st_size,
              "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "git_sha": os.environ["GITHUB_SHA"],
              "s3_key_backup": f"postgres/{backup.name}",
              "s3_key_checksum": f"postgres/{backup.name}.sha256",
              "s3_key_manifest": f"postgres/{backup.name}.manifest.json",
          }
          Path(f"{backup}.manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Validate backup set locally before upload
        run: |
          python scripts/validate_backup_set.py \\
            --backup "$BACKUP_FILE" \\
            --checksum "$BACKUP_FILE.sha256" \\
            --manifest "$BACKUP_FILE.manifest.json" \\
            --expected-repository "$GITHUB_REPOSITORY"

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws s3 cp "$BACKUP_FILE" "s3://$S3_BUCKET/postgres/$BACKUP_FILE" --region "$AWS_REGION"
          aws s3 cp "$BACKUP_FILE.sha256" "s3://$S3_BUCKET/postgres/$BACKUP_FILE.sha256" --region "$AWS_REGION"
          aws s3 cp "$BACKUP_FILE.manifest.json" "s3://$S3_BUCKET/postgres/$BACKUP_FILE.manifest.json" --region "$AWS_REGION"

      - name: Done
        run: |
          echo "Backup uploaded successfully"
