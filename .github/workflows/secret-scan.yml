name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --fail --location --retry 3 --output "${RUNNER_TEMP}/${archive}" "${url}"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}"
          test -x "${RUNNER_TEMP}/gitleaks"

      - name: Run Gitleaks and validate execution
        shell: bash
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          if [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] && [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] && [[ "$HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            log_opts="${BASE_SHA}..${HEAD_SHA}"
          else
            log_opts="${HEAD_SHA}^..${HEAD_SHA}"
          fi
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --log-opts "$log_opts" \
            --redact \
            --report-format sarif \
            --report-path gitleaks-results.sarif \
            --exit-code 2
          status=$?
          set -e

          if [[ ! -s gitleaks-results.sarif ]]; then
            echo "Gitleaks did not produce a report."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("gitleaks-results.sarif").read_text(encoding="utf-8"))
          if report.get("version") != "2.1.0":
              raise SystemExit("Gitleaks report has an unsupported SARIF version")
          runs = report.get("runs")
          if not isinstance(runs, list) or not runs:
              raise SystemExit("Gitleaks report has no SARIF runs")
          for run in runs:
              driver = run.get("tool", {}).get("driver", {})
              if str(driver.get("name", "")).lower() != "gitleaks":
                  raise SystemExit("Gitleaks report has an unexpected scanner identity")
              invocations = run.get("invocations")
              if invocations is not None:
                  if not isinstance(invocations, list):
                      raise SystemExit("Gitleaks report has invalid execution metadata")
                  if any(item.get("executionSuccessful") is False for item in invocations):
                      raise SystemExit("Gitleaks execution was not successful")
          PY

          if [[ "$status" -eq 0 || "$status" -eq 2 ]]; then
            if [[ "$status" -eq 2 ]]; then
              echo "Gitleaks completed and reported findings; the report remains evidence for the trusted evaluator."
            fi
            exit 0
          fi
          echo "Gitleaks execution failed with exit code $status."
          exit "$status"

      - name: Archive Gitleaks SARIF
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results.sarif
          path: gitleaks-results.sarif
          retention-days: 7
