name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        continue-on-error: true
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize Gitleaks evidence
        if: ${{ hashFiles('gitleaks.raw.json') != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/security_release_gate_collect.py sanitize-gitleaks \
            --pages gitleaks.raw.json --head-sha "$HEAD_SHA" \
            --output gitleaks-sanitized.json
          rm -f gitleaks.raw.json

      - name: Upload sanitized Gitleaks evidence
        if: ${{ hashFiles('gitleaks-sanitized.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gitleaks-sanitized-json
          path: gitleaks-sanitized.json
          retention-days: 7

